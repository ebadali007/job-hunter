name: Autonomous 24/7 Global Job Hunter

on:
  schedule:
    # Runs continuously day and night every 20 minutes (PC can be completely OFF)
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  hunt-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run Autonomous Job Hunt & Auto-Apply
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: qwen/qwen3.8-27b
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          CANDIDATE_NAME: "Ebad Ali"
          CANDIDATE_EMAIL: "m.ebaadali007@gmail.com"
          CANDIDATE_PHONE: "+923293246454"
          CANDIDATE_LOCATION: "Karachi, Pakistan (Open to Remote US/EU/APAC)"
          CANDIDATE_LINKEDIN: "https://linkedin.com/in/ebaad-zai-57024b230"
          CANDIDATE_GITHUB: "https://github.com/ebadali007"
          CANDIDATE_PORTFOLIO: "https://ebad-ali-portfolio.surge.sh/remote/index.html"
          TARGET_ROLES: "Frontend Engineer, Senior Frontend Developer, React Developer, Next.js Developer, TypeScript Developer, Software Engineer, Web Developer, WordPress Developer"
          TARGET_LOCATIONS: "Worldwide Remote, United States, Canada, United Kingdom, Europe, Germany, Netherlands, UAE, Dubai, Australia, APAC"
          MATCH_THRESHOLD: 55
          MAX_JOB_AGE_HOURS: 48
          CONTINUOUS_HUNT_MODE: "true"
          AUTO_PILOT_INTERVAL_MINUTES: 2
          AUTO_APPLY_ENABLED: "true"
          AUTO_APPLY_MIN_SCORE: 55
          ENABLE_EMAIL_DIGEST: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data applications
          python run.py --hunt

      - name: Save Generated Applications as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailored-job-applications
          path: applications/
          if-no-files-found: ignore
