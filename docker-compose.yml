version: '3.8'

services:
  job-hunter:
    build: .
    container_name: job-hunter-ai
    restart: always
    ports:
      - "8050:8050"
    environment:
      - PORT=8050
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./applications:/app/applications
      - ./config:/app/config
